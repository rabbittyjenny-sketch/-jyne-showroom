<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO WORKS - iDEAS365</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #1565C0;
            --accent: #1E88E5;
            --text-dark: #1A1A1A;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
        }

        * {
            font-family: inherit;
        }

        .nav-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo-img {
            height: 45px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            transition: transform 0.3s;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 120px 20px 80px;
            max-width: 1000px;
            margin: 0 auto;
            gap: 30px;
        }

        .page-title {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: clamp(4rem, 10vw, 7.5rem);
            text-align: center;
            line-height: 0.9;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: titleIn 0.9s ease forwards;
        }

        .page-subtitle {
            font-size: 1.15rem;
            font-weight: 400;
            margin: 0 0 20px;
            text-align: center;
            opacity: 0;
            animation: titleIn 0.9s ease 0.35s forwards;
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-card {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            padding: 50px;
            color: var(--text-dark);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease;
        }

        .content-card.single {
            grid-template-columns: 1fr;
        }

        .content-card.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        .content-card.in-view:hover {
            transform: translateY(-5px);
            box-shadow: 0 28px 55px rgba(0, 0, 0, 0.26);
        }

        .col-title {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 2.2rem;
            color: var(--accent);
            margin: 0 0 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .col-desc {
            font-size: 0.95rem;
            line-height: 1.8;
            font-weight: 300;
            margin: 0 0 10px;
            color: #333;
        }

        .col-desc strong {
            font-weight: 700;
            color: var(--text-dark);
        }

        .tl-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .tl-item:last-child {
            border-bottom: none;
        }

        .tl-year {
            font-size: 0.68rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .tl-role {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-dark);
            margin-bottom: 1px;
        }

        .tl-place {
            font-size: 0.76rem;
            color: #888;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .tl-desc {
            font-size: 0.82rem;
            line-height: 1.6;
            color: #555;
            font-weight: 300;
        }

        .skg {
            margin-bottom: 14px;
        }

        .skt {
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
            color: #666;
            text-transform: uppercase;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            padding: 3px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #444;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            cursor: default;
        }

        .tag:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .hl {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .hl li {
            font-size: 0.88rem;
            line-height: 1.7;
            padding: 8px 0 8px 16px;
            border-bottom: 1px solid #eee;
            position: relative;
            color: #333;
            font-weight: 300;
        }

        .hl li:last-child {
            border-bottom: none;
        }

        .hl li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }

        .cs-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .cs-pill {
            background: #1565C0;
            color: #ffffff;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .proof-grid-result {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .proof-grid-result img {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 10px;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .proof-grid-work {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .proof-grid-work img {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 10px;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .photo-slot {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #e3f2fd;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .photo-slot:hover {
            transform: scale(1.03);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.2);
        }

        .photo-slot-tall {
            aspect-ratio: 2/3;
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .skills-photo-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 8px;
        }

        .video-wrap {
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
            display: block;
            text-decoration: none;
        }

        .video-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.25s;
        }

        .video-wrap:hover img {
            opacity: 0.82;
        }

        .yt-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .yt-play svg {
            width: 60px;
            height: 42px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }

        .big-btn {
            display: inline-block;
            background: #1565C0;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.2s;
        }

        .big-btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        #cursor-glow {
            position: fixed;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(30, 136, 229, 0.15) 0%, transparent 68%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            left: -999px;
            top: -999px;
            transition: left 0.07s, top 0.07s;
        }

        .site-footer {
            background: #0D47A1;
            color: #fff;
            text-align: center;
            padding: 52px 20px 28px;
            margin-top: 60px;
            width: 100%;
        }

        .footer-brand {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin: 0 0 4px;
        }

        .footer-copy {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            margin: 20px 0 0;
        }

        .back-fixed {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            display: block;
        }

        .back-fixed img {
            height: 68px;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25));
            transition: transform 0.2s;
        }

        .back-fixed:hover img {
            transform: scale(1.08);
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 90px 16px 48px;
            }

            .page-title {
                font-size: clamp(3rem, 14vw, 5rem);
            }

            .content-card {
                padding: 24px 20px;
                border-radius: 16px;
                gap: 24px;
                grid-template-columns: 1fr !important;
            }

            .nav-header {
                padding: 14px 16px;
            }

            .logo-img {
                height: 36px;
            }

            .proof-grid-result {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .proof-grid-work {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .video-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>

    <style>
        /* added: link back to the main island map (square, no frame) */
        .main-menu-link { font-family: 'Anton', 'Noto Sans Thai', sans-serif; font-size: 0.85rem; letter-spacing: 2px;
            text-decoration: none; color: inherit; background: rgba(0,0,0,0.22); padding: 9px 16px; border-radius: 0; }
        .main-menu-link:hover { background: rgba(0,0,0,0.38); }
    </style>
</head>

<body>
    <div id="cursor-glow"></div>
    <header class="nav-header">
        <a href="index.html"><img
                src="https://ik.imagekit.io/ideas365logo/LOGO_iDEAS365Black.png?updatedAt=1772818424343" alt="iDEAS365"
                class="logo-img"></a>
        <a href="index.html" class="main-menu-link">MAIN MENU</a>
    </header>
    <main class="main-content">
        <h1 class="page-title">PHOTO<br>WORKS</h1>
        <p class="page-subtitle">รูปผลงาน</p>
        <!-- MAKEUP & HAIR (image from the PREVIOUS WORK grid) -->
        <div class="content-card single">
            <h2 class="col-title">MAKEUP &amp; HAIR · แต่งหน้า · ทำผม</h2>
            <div class="proof-grid-work">
                <img src="https://ik.imagekit.io/ideas365logo/makeup1.jpg">
            </div>
        </div>

        <!-- LIVE RESULTS (screenshots from the RESULT grid) -->
        <div class="content-card single">
            <h2 class="col-title">LIVE RESULTS · ผลไลฟ์ 6 หลัก</h2>
            <div class="proof-grid-result">
                <img src="https://ik.imagekit.io/ideas365logo/Screenshot%202026-03-08%20095955.png?updatedAt=1772938871229">
                <img src="https://ik.imagekit.io/ideas365logo/Screenshot%202026-03-08%20100329.png?updatedAt=1772939043965">
                <img src="https://ik.imagekit.io/ideas365logo/Screenshot%202026-03-08%20095903.png?updatedAt=1772938871281">
                <img src="https://ik.imagekit.io/ideas365logo/Screenshot%202026-03-08%20100027.png?updatedAt=1772938870951">
            </div>
        </div>

        <!-- COMING SOON (added headings — content to come) -->
        <div class="content-card single">
            <h2 class="col-title">COMING SOON · เร็วๆ นี้</h2>
            <ul class="hl">
                <li>อาหาร</li>
                <li>ออกบูธ · อีเวนต์</li>
            </ul>
        </div>
</main>

    <footer class="site-footer">
        <p class="footer-brand">iDEAS365</p>
        <p class="footer-copy">© 2025 iDEAS365 · All rights reserved</p>
    </footer>

    <a href="island_works.html" class="back-fixed" onclick="return goBack(this.href)">
        <img src="https://ik.imagekit.io/ideas365logo/back_button.png" alt="Back to Map"
            onerror="this.style.display='none'">
    </a>

    <script>
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', e => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in-view'); });
        }, { threshold: 0.08 });
        document.querySelectorAll('.content-card').forEach(c => observer.observe(c));
    </script>

<script>
    /* added: BACK = previous page (or this island's map when opened directly) */
    function goBack(fallback) {
        try { if (document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return false; } } catch (e) {}
        location.href = fallback; return false;
    }
</script>
</body>

</html>
