<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEARNING BRIDGE - iDEAS365</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Thai:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --island-shadow: drop-shadow(0 12px 15px rgba(0, 0, 0, 0.35));
            --transition-smooth: all 0.4s ease-out;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans Thai', sans-serif;
            background-image: url('https://ik.imagekit.io/ideas365logo/background_mix.png?updatedAt=1772818424869');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #6FB3D2;
            overflow: hidden;
            /* desktop: no scroll */
        }

        * {
            font-family: inherit;
        }

        /* LOGO — มุมบนซ้าย */
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 40%;
            padding: 25px 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .logo-img {
            height: 45px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            pointer-events: auto;
        }

        #view-map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            margin: 0 auto;
        }

        .island {
            position: absolute;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: var(--island-shadow);
            transform-origin: center bottom;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        @keyframes individualFloat {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(0.4deg);
            }
        }

        /* 🏝️ Desktop positions — ไม่แตะเลย */
        #island-system {
            top: 20%;
            left: 42%;
            width: 17%;
            animation: individualFloat 7s ease-in-out infinite;
        }

        #island-profile {
            top: 26%;
            left: 16%;
            width: 20%;
            animation: individualFloat 8s ease-in-out infinite;
        }

        #island-work {
            top: 28%;
            right: 16%;
            width: 20%;
            animation: individualFloat 9s ease-in-out infinite;
            animation-delay: -0.5s;
        }

        #island-library {
            top: 56%;
            left: 10%;
            width: 20%;
            animation: individualFloat 7.5s ease-in-out infinite;
            animation-delay: 0.8s;
        }

        #island-blog {
            bottom: 8%;
            left: 43%;
            width: 20%;
            animation: individualFloat 8.5s ease-in-out infinite;
            animation-delay: -1.2s;
        }

        #island-contact {
            bottom: 0;
            right: 5%;
            width: 27%;
            animation: none;
            filter: drop-shadow(0 -8px 12px rgba(0, 0, 0, 0.2));
        }

        #island-marina {
            top: 48%;
            right: 0%;
            width: 16%;
            animation: individualFloat 8.2s ease-in-out infinite;
            animation-delay: -2s;
        }

        .island:hover {
            scale: 1.05;
            margin-top: -8px;
            filter: brightness(1.1) drop-shadow(0 20px 25px rgba(255, 255, 255, 0.35));
            z-index: 100;
        }

        .island img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Badge */
        .island-badge {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 4px 6px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 600;
            top: -28px;
            white-space: nowrap;
            transition: var(--transition-smooth);
            z-index: 10;
        }
        /* Gradient text sweep on badge hover */
        .island:hover .island-badge {
            color: #0000;
            background:
                linear-gradient(90deg, #B03A00 0%, #F5B800 50%, #1E7A3E 100%)
                var(--_p, 100%) / 200% no-repeat,
                rgba(255,255,255,0.97);
            -webkit-background-clip: text, padding-box;
            background-clip: text, padding-box;
            --_p: 0%;
        }

        /* 💬 Tooltip ::after — desktop hover */
        .island::after {
            content: attr(data-tooltip);
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) scale(0.3);
            transform-origin: bottom center;
            background: #ffffff;
            color: #000;
            padding: 8px 10px;
            border-radius: 30px;
            font-size: 9px;
            font-weight: 650;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200;
            border: 1px solid #000;
            box-shadow: 2px 2px 0 #000;
        }

        .island:hover::after {
            opacity: 1;
            visibility: visible;
            top: -55px;
            /* สูงกว่า badge → ไม่ทับ */
            transform: translateX(-50%) scale(1);
        }

        /* ============================================================
           📱 MOBILE FIXES — แก้เฉพาะส่วนนี้ ไม่ยุ่ง desktop เลย
           ============================================================ */
        @media (max-width: 768px) {

            /* 1. เปิด scroll — แก้ contact หาย */
            body,
            html {
                overflow: auto !important;
                height: auto !important;
            }

            #view-map {
                position: relative !important;
                height: auto !important;
                display: block !important;
            }

            .map-wrapper {
                height: 1580px !important;
                width: 100% !important;
            }

            /* 2. ซ่อน tooltip บนมือถือ (touch ทำให้ค้าง) */
            .island::after,
            .island:hover::after {
                display: none !important;
            }

            /* 3. Logo */
            .nav-header {
                padding: 10px 16px;
                width: 60%;
            }

            .logo-img {
                height: 32px;
            }

            /* 4. เกาะ — ปิด float, ขยายขนาด */
            .island {
                animation: none !important;
                width: 55% !important;
            }

            /* zigzag: About(ซ้าย) → Works(ขวา) → Academe(ซ้าย) → Learning(ขวา) → Blog(กลาง-ซ้าย) → Contact(ขวา) */
            #island-profile {
                top: 3% !important;
                left: 3% !important;
                right: auto !important;
                bottom: auto !important;
            }

            #island-work {
                top: 16% !important;
                right: 3% !important;
                left: auto !important;
                bottom: auto !important;
            }

            #island-system {
                top: 30% !important;
                left: 3% !important;
                right: auto !important;
                bottom: auto !important;
            }

            #island-library {
                top: 44% !important;
                right: 3% !important;
                left: auto !important;
                bottom: auto !important;
            }

            #island-blog {
                top: 58% !important;
                left: 10% !important;
                right: auto !important;
                bottom: auto !important;
            }

            #island-contact {
                top: 86% !important;
                left: 10% !important;
                right: auto !important;
                bottom: auto !important;
                filter: var(--island-shadow) !important;
            }

            #island-marina {
                top: 73% !important;
                right: 3% !important;
                left: auto !important;
                bottom: auto !important;
            }

            /* 5. Badge */
            .island-badge {
                font-size: 10px !important;
                padding: 4px 10px !important;
                top: -28px !important;
            }
        }
    </style>

    <style>
        /* sub-map: same .island / .island-badge as the main map */
        .submap-title { position: fixed; top: 28px; left: 50%; transform: translateX(-50%); z-index: 101;
            font-family: 'Anton', 'Noto Sans Thai', sans-serif; font-size: 1.3rem; letter-spacing: 2px; color: #000;
            background: rgba(255,255,255,0.95); padding: 6px 18px; border-radius: 0; white-space: nowrap; }
        .main-menu-link { position: fixed; top: 28px; right: 40px; z-index: 101; font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 0.85rem; letter-spacing: 2px; text-decoration: none; color: #fff; background: rgba(0,0,0,0.55); padding: 9px 16px; }
        .sub-island { animation: individualFloat 8s ease-in-out infinite; }
        .sub-island:nth-of-type(2) { animation-duration: 9s; animation-delay: -0.6s; }
        .sub-island:nth-of-type(3) { animation-duration: 7.5s; animation-delay: -1.2s; }
        /* until the button picture exists: a box like the owner's diagram */
        .sub-box { display: none; background: #1A1A1A; color: #fff; padding: 16px 18px; width: 100%; box-sizing: border-box; text-align: left; }
        .sub-box b { display: block; font-size: 1.05rem; margin-bottom: 6px; }
        .sub-box span { display: block; font-size: 0.8rem; line-height: 1.6; opacity: 0.85; }
        .back-fixed { position: fixed; bottom: 28px; right: 28px; z-index: 999; display: block; }
        .back-fixed img { height: 68px; display: block; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.25)); transition: transform 0.2s; }
        .back-fixed:hover img { transform: scale(1.08); }
        @media (max-width: 768px) {
            .map-wrapper { height: calc(var(--n) * 320px + 120px) !important; }
            .sub-island { width: 72% !important; left: 14% !important; right: auto !important; animation: none !important; }
            .main-menu-link { top: 12px; right: 16px; }
            .submap-title { top: 60px; font-size: 1rem; }
        }
    </style>

    <style>@media (max-width: 768px) { .sub-island { top: var(--m-top) !important; } }</style>
</head>

<body>
    <header class="nav-header">
        <a href="index.html"><img src="https://ik.imagekit.io/ideas365logo/LOGO_iDEAS365Black.png?updatedAt=1772818424343" alt="iDEAS365"
            class="logo-img"></a>
    </header>
    <div class="submap-title">LEARNING BRIDGE</div>
    <a href="index.html" class="main-menu-link">MAIN MENU</a>

    <div id="view-map">
        <div class="map-wrapper" style="--n:3">
            <a href="learning_tools.html" class="island sub-island" data-tooltip="รวมเครื่องมือ / ระบบ AI" style="left:12%;top:30%;width:24%;--m-top:120px">
                <div class="island-badge">รวมเครื่องมือ / ระบบ AI</div>
                <img src="islands/learning/btn-tools.png" alt="รวมเครื่องมือ / ระบบ AI" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <div class="sub-box"><b>รวมเครื่องมือ / ระบบ AI</b><span>เครื่องมือและระบบที่ทำงานร่วมกับ AI</span><span>สร้างเองทั้งระบบ</span></div>

                <img src="islands/learning/btn-docs.png" alt="เอกสาร · ความรู้" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <div class="sub-box"><b>เอกสาร · ความรู้</b><span>เอกสารฟรี · หนังสือ</span><span>เทมเพลต · ตารางช่วยงาน</span></div>

                <div class="island-badge">งานออกแบบ</div>
                <img src="islands/learning/btn-design.png" alt="งานออกแบบ" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <div class="sub-box"><b>งานออกแบบ</b><span>หน้าเว็บ (Wix)</span><span>Creative · กราฟิก</span><span>แผนคอนเทนต์การตลาด</span></div>
            </a>
        </div>
    </div>

    <a href="index.html" class="back-fixed"><img src="https://ik.imagekit.io/ideas365logo/BACK%20(1)%20(1).png?updatedAt=1773177420277" alt="Back"></a>
</body>

</html>
