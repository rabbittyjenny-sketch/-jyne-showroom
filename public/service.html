<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A SERVICE MANIA - iDEAS365</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #1565C0;
            --accent: #1E88E5;
            --text-dark: #1A1A1A;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
        }

        * {
            font-family: inherit;
        }

        .nav-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo-img {
            height: 45px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            transition: transform 0.3s;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 120px 20px 80px;
            max-width: 1000px;
            margin: 0 auto;
            gap: 30px;
        }

        .page-title {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: clamp(4rem, 10vw, 7.5rem);
            text-align: center;
            line-height: 0.9;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: titleIn 0.9s ease forwards;
        }

        .page-subtitle {
            font-size: 1.15rem;
            font-weight: 400;
            margin: 0 0 20px;
            text-align: center;
            opacity: 0;
            animation: titleIn 0.9s ease 0.35s forwards;
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-card {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            padding: 50px;
            color: var(--text-dark);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease;
        }

        .content-card.single {
            grid-template-columns: 1fr;
        }

        .content-card.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        .content-card.in-view:hover {
            transform: translateY(-5px);
            box-shadow: 0 28px 55px rgba(0, 0, 0, 0.26);
        }

        .col-title {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 2.2rem;
            color: var(--accent);
            margin: 0 0 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .col-desc {
            font-size: 0.95rem;
            line-height: 1.8;
            font-weight: 300;
            margin: 0 0 10px;
            color: #333;
        }

        .col-desc strong {
            font-weight: 700;
            color: var(--text-dark);
        }

        .tl-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .tl-item:last-child {
            border-bottom: none;
        }

        .tl-year {
            font-size: 0.68rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .tl-role {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-dark);
            margin-bottom: 1px;
        }

        .tl-place {
            font-size: 0.76rem;
            color: #888;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .tl-desc {
            font-size: 0.82rem;
            line-height: 1.6;
            color: #555;
            font-weight: 300;
        }

        .skg {
            margin-bottom: 14px;
        }

        .skt {
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
            color: #666;
            text-transform: uppercase;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            padding: 3px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #444;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            cursor: default;
        }

        .tag:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .hl {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .hl li {
            font-size: 0.88rem;
            line-height: 1.7;
            padding: 8px 0 8px 16px;
            border-bottom: 1px solid #eee;
            position: relative;
            color: #333;
            font-weight: 300;
        }

        .hl li:last-child {
            border-bottom: none;
        }

        .hl li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }

        .cs-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .cs-pill {
            background: #1565C0;
            color: #ffffff;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .proof-grid-result {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .proof-grid-result img {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 10px;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .proof-grid-work {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .proof-grid-work img {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 10px;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .photo-slot {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #e3f2fd;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .photo-slot:hover {
            transform: scale(1.03);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.2);
        }

        .photo-slot-tall {
            aspect-ratio: 2/3;
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .skills-photo-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 8px;
        }

        .video-wrap {
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
            display: block;
            text-decoration: none;
        }

        .video-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.25s;
        }

        .video-wrap:hover img {
            opacity: 0.82;
        }

        .yt-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .yt-play svg {
            width: 60px;
            height: 42px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }

        .big-btn {
            display: inline-block;
            background: #1565C0;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.2s;
        }

        .big-btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        #cursor-glow {
            position: fixed;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(30, 136, 229, 0.15) 0%, transparent 68%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            left: -999px;
            top: -999px;
            transition: left 0.07s, top 0.07s;
        }

        .site-footer {
            background: #0D47A1;
            color: #fff;
            text-align: center;
            padding: 52px 20px 28px;
            margin-top: 60px;
            width: 100%;
        }

        .footer-brand {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin: 0 0 4px;
        }

        .footer-copy {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            margin: 20px 0 0;
        }

        .back-fixed {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            display: block;
        }

        .back-fixed img {
            height: 68px;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25));
            transition: transform 0.2s;
        }

        .back-fixed:hover img {
            transform: scale(1.08);
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 90px 16px 48px;
            }

            .page-title {
                font-size: clamp(3rem, 14vw, 5rem);
            }

            .content-card {
                padding: 24px 20px;
                border-radius: 16px;
                gap: 24px;
                grid-template-columns: 1fr !important;
            }

            .nav-header {
                padding: 14px 16px;
            }

            .logo-img {
                height: 36px;
            }

            .proof-grid-result {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .proof-grid-work {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .video-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>

    <style>
        /* added: link back to the main island map (square, no frame) */
        .main-menu-link { font-family: 'Anton', 'Noto Sans Thai', sans-serif; font-size: 0.85rem; letter-spacing: 2px;
            text-decoration: none; color: inherit; background: rgba(0,0,0,0.22); padding: 9px 16px; border-radius: 0; }
        .main-menu-link:hover { background: rgba(0,0,0,0.38); }
    </style>

    <style>
        /* added: info sheet + leave-site pop-up (square, no white frame) */
        .nav-header .main-menu-link { margin-left: auto; }
        .doc-sheet { display: block !important; max-width: 820px; min-height: 60vh; padding: 56px 64px; border-radius: 0; }
        @media (max-width: 640px) { .doc-sheet { padding: 36px 24px; } }
        .doc-meta { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: #999; margin-bottom: 28px; }
        .doc-empty { color: #aaa; font-size: 0.95rem; margin-top: 24px; }
        .leave-wrap { width: 100%; display: flex; justify-content: center; padding: 40px 20px 50px; }
        .leave-btn { display: inline-block; background: #1A1A1A; color: #fff; font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; padding: 16px 40px; border-radius: 0; text-decoration: none; }
        .leave-btn::after { content: ' →'; }
        .leave-btn:hover { background: #000; }
        .academy-btn { border-radius: 0 !important; }
        .leave-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.6); display: none;
            align-items: center; justify-content: center; padding: 20px; }
        .leave-overlay.open { display: flex; }
        .leave-box { background: #1A1A1A; color: #fff; max-width: 440px; width: 100%; padding: 32px 30px 26px; border-radius: 0;
            font-family: 'Noto Sans Thai', sans-serif; }
        .leave-box h3 { font-family: 'Anton', 'Noto Sans Thai', sans-serif; font-weight: 400; font-size: 1.5rem; letter-spacing: 1px; margin: 0 0 12px; }
        .leave-box p { font-size: 0.95rem; line-height: 1.7; margin: 0 0 8px; opacity: 0.9; }
        .leave-box .leave-host { font-size: 0.8rem; opacity: 0.6; word-break: break-all; }
        .leave-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
        .leave-actions button { flex: 1; min-width: 140px; border: 0; border-radius: 0; padding: 13px 16px; cursor: pointer;
            font-family: 'Anton', 'Noto Sans Thai', sans-serif; font-size: 0.95rem; letter-spacing: 1px; }
        .leave-ok { background: var(--accent); color: #fff; }
        .leave-ok:hover { filter: brightness(0.9); }
        .leave-cancel { background: rgba(255,255,255,0.12); color: #fff; }
        .leave-cancel:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>

<body>
    <div id="cursor-glow"></div>
    <header class="nav-header">
        <a href="index.html"><img
                src="https://ik.imagekit.io/ideas365logo/LOGO_iDEAS365Black.png?updatedAt=1772818424343" alt="iDEAS365"
                class="logo-img"></a>
        <a href="index.html" class="main-menu-link">MAIN MENU</a>
    </header>
    <main class="main-content">
        <h1 class="page-title">A SERVICE<br>MANIA</h1>
        <p class="page-subtitle">มีบริการอะไรบ้าง</p>
        <!-- INFO SHEET (content to come) -->
        <div class="content-card doc-sheet in-view">
            <div class="doc-meta">iDEAS365 · A SERVICE MANIA · ข้อมูลเบื้องต้น</div>
            <h2 class="col-title">SERVICES · บริการ</h2>
            <p class="doc-empty">เนื้อหาจะเพิ่มภายหลัง</p>
        </div>

        <div class="leave-wrap">
            <a href="https://i-deas-365-web.vercel.app/services" class="leave-btn" data-leave="iDEAS365-web">ดูบริการทั้งหมด</a>
        </div>
</main>

    <footer class="site-footer">
        <p class="footer-brand">iDEAS365</p>
        <p class="footer-copy">© 2025 iDEAS365 · All rights reserved</p>
    </footer>

    <a href="index.html" class="back-fixed" onclick="return goBack(this.href)">
        <img src="https://ik.imagekit.io/ideas365logo/back_button.png" alt="Back to Map"
            onerror="this.style.display='none'">
    </a>

    <script>
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', e => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in-view'); });
        }, { threshold: 0.08 });
        document.querySelectorAll('.content-card').forEach(c => observer.observe(c));
    </script>

<!-- added: pop-up before going to another website -->
<div class="leave-overlay" id="leave-overlay" role="dialog" aria-modal="true" aria-labelledby="leave-title">
    <div class="leave-box">
        <h3 id="leave-title">ออกจาก iDEAS365</h3>
        <p>ปุ่มนี้จะพาไปที่ <b id="leave-name"></b> ซึ่งเป็นเว็บไซต์แยกจากหน้านี้</p>
        <p class="leave-host" id="leave-host"></p>
        <p>ต้องการไปต่อหรือไม่?</p>
        <div class="leave-actions">
            <button type="button" class="leave-ok" id="leave-ok">ยอมรับ ไปต่อ</button>
            <button type="button" class="leave-cancel" id="leave-cancel">ยกเลิก</button>
        </div>
    </div>
</div>
<script>
    /* added: links with data-leave ask before leaving the site */
    (function () {
        var ov = document.getElementById('leave-overlay'), target = null;
        function close() { ov.classList.remove('open'); target = null; }
        document.querySelectorAll('a[data-leave]').forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault(); target = a.href;
                document.getElementById('leave-name').textContent = a.getAttribute('data-leave');
                document.getElementById('leave-host').textContent = new URL(a.href).host;
                ov.classList.add('open'); document.getElementById('leave-ok').focus();
            });
        });
        document.getElementById('leave-ok').addEventListener('click', function () { if (target) location.href = target; });
        document.getElementById('leave-cancel').addEventListener('click', close);
        ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
</script>

<script>
    /* added: BACK = previous page (or this island's map when opened directly) */
    function goBack(fallback) {
        try { if (document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return false; } } catch (e) {}
        location.href = fallback; return false;
    }
</script>
</body>

</html>
