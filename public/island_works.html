<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIC&CLIP WAREHOUSE - iDEAS365</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --yellow:   #F5B800;
            --dark:     #1A1A1A;
            --card-bg:  #222222;
            --inner-bg: #2c2c2c;
            --border:   rgba(255,255,255,0.1);
            --muted:    rgba(255,255,255,0.5);
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Noto Sans Thai', sans-serif;
            background: var(--yellow);
            color: #fff;
            overflow-x: hidden;
        }
        * { font-family: inherit; }

        /* ═══════════════ NAV ═══════════════ */
        .nav-header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            padding: 16px 36px;
            z-index: 200;
        }
        .logo-img { height: 40px; display: block; }
        .back-btn img { height: 44px; width: auto; display: block; }

        /* ═══════════════ HERO ═══════════════ */
        .hero {
            padding: 130px 24px 56px;
            text-align: center;
        }
        .page-title {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: clamp(5rem, 13vw, 9rem);
            line-height: 0.87;
            text-transform: uppercase;
            color: var(--dark);
            letter-spacing: 1px;
            margin-bottom: 18px;
        }
        .page-subtitle {
            font-size: 1rem;
            color: var(--dark);
            opacity: 0.65;
            font-weight: 400;
        }

        /* ═══════════════ MAIN CONTAINER ═══════════════ */
        .main-content {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px 80px;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        /* ═══════════════ SECTION CARD ═══════════════ */
        .section-card {
            background: var(--dark);
            border-radius: 22px;
            padding: 42px 42px 48px;
            width: 100%;
        }
        .section-head {
            margin-bottom: 28px;
        }
        .section-title {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 1.75rem;
            color: var(--yellow);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding-bottom: 12px;
            border-bottom: 1.5px solid rgba(255,255,255,0.1);
            margin-bottom: 6px;
        }
        .section-sub {
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 300;
            padding-top: 4px;
        }

        /* ═══════════════ BADGE ═══════════════ */
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .badge-ai       { background: rgba(251,188,5,0.18);   color: #FBBC05; }
        .badge-live     { background: rgba(234,67,53,0.18);   color: #ff6b6b; }
        .badge-biz      { background: rgba(52,168,83,0.18);   color: #5bdb8a; }
        .badge-sys      { background: rgba(100,180,255,0.15); color: #7ec8ff; }
        .badge-soon     { background: rgba(255,255,255,0.08); color: #888; }
        .badge-creative { background: rgba(180,130,255,0.18); color: #c9a0ff; }
        .badge-sold     { background: rgba(255,80,80,0.15);   color: #ff7070; }

        /* ═══════════════════════════════════════════════════
           SECTION 1 — AI CARDS  3-col · portrait · no shadow
        ═══════════════════════════════════════════════════ */
        .ai-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .ai-card {
            background: var(--inner-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #fff;
            /* NO box-shadow · NO hover transition */
        }
        .ai-card.coming  { opacity: 0.45; pointer-events: none; }
        .ai-card.soldout { opacity: 0.45; pointer-events: none; }

        /* Portrait cover 3:4 */
        .ai-cover {
            width: 100%;
            aspect-ratio: 3 / 4;
            position: relative;
            overflow: hidden;
            background: #333;
            flex-shrink: 0;
        }
        .ai-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .ai-cover-placeholder {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: linear-gradient(160deg, #303030 0%, #262626 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            opacity: 0.18;
            flex-shrink: 0;
        }
        /* Logo chip — overlaid top-left on cover */
        .ai-logo-chip {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(0,0,0,0.55);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ai-logo-chip img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        /* Badge chip — overlaid top-right */
        .ai-badge-chip {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        /* Card body */
        .ai-body {
            padding: 16px 18px 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ai-title-en {
            font-weight: 700;
            font-size: 0.97rem;
            line-height: 1.25;
            color: #fff;
        }
        .ai-title-th {
            font-size: 0.76rem;
            color: var(--muted);
            font-weight: 300;
        }
        .ai-desc {
            font-size: 0.78rem;
            line-height: 1.6;
            color: rgba(255,255,255,0.58);
            font-weight: 300;
            margin-top: 8px;
            flex: 1;
        }

        /* CTA button — no hover */
        .ai-footer {
            padding: 10px 18px 18px;
        }
        .ai-cta {
            display: block;
            width: 100%;
            text-align: center;
            padding: 9px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.28);
            font-size: 0.67rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
            background: transparent;
        }

        /* ═══════════════════════════════════════════════════
           SECTIONS 2 & 3 — PROJECT CARDS  3-col · no shadow
        ═══════════════════════════════════════════════════ */
        .proj-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .proj-card {
            background: var(--inner-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #fff;
            /* NO box-shadow · NO hover */
        }
        .proj-card.coming  { opacity: 0.45; pointer-events: none; }
        .proj-card.soldout { opacity: 0.45; pointer-events: none; }

        /* Optional 16:9 cover */
        .proj-cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #333;
            flex-shrink: 0;
        }
        .proj-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .proj-body {
            padding: 16px 18px 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .proj-logo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .proj-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 7px;
        }
        .proj-name-en {
            font-weight: 700;
            font-size: 0.93rem;
            line-height: 1.28;
        }
        .proj-name-th {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 300;
        }
        .proj-desc {
            font-size: 0.77rem;
            line-height: 1.58;
            color: rgba(255,255,255,0.57);
            font-weight: 300;
            margin-top: 6px;
            flex: 1;
        }
        .proj-footer {
            padding: 10px 18px 18px;
        }
        .proj-cta {
            display: block;
            width: 100%;
            text-align: center;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.25);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
            background: transparent;
        }

        /* ═══════════════ VIDEO GRID ═══════════════ */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .video-wrap {
            display: block;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            text-decoration: none;
        }
        .video-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .yt-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .yt-play svg { width: 56px; height: 40px; }

        /* ═══════════════ CASE STUDY ═══════════════ */
        .case-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }
        .col-title {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 1.65rem;
            color: var(--yellow);
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .col-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.72);
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .hl { list-style: none; padding: 0; }
        .hl li {
            font-size: 0.84rem;
            line-height: 1.65;
            padding: 8px 0 8px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: relative;
            color: rgba(255,255,255,0.76);
            font-weight: 300;
        }
        .hl li:last-child { border-bottom: none; }
        .hl li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--yellow);
            font-weight: 700;
        }
        .cs-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }
        .cs-pill {
            background: var(--yellow);
            color: var(--dark);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .proof-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .proof-grid img {
            width: 100%;
            border-radius: 8px;
            object-fit: cover;
            display: block;
            background: #2a2a2a;
            min-height: 80px;
        }
        .proof-caption {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 10px;
        }

        /* ═══════════════ LOADING ═══════════════ */
        .loading-msg {
            color: rgba(255,255,255,0.35);
            font-size: 0.84rem;
            text-align: center;
            padding: 32px 0;
            grid-column: 1 / -1;
        }

        /* ═══════════════ FOOTER ═══════════════ */
        .site-footer {
            background: var(--dark);
            color: #fff;
            text-align: center;
            padding: 48px 20px 24px;
            margin-top: 10px;
        }
        .footer-brand {
            font-family: 'Anton', 'Noto Sans Thai', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .dot-r { color: #EA4335; }
        .dot-g { color: #34A853; }
        .dot-b { color: #4285F4; }
        .dot-y { color: #FBBC05; }
        .footer-tagline {
            font-size: 0.73rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            margin-bottom: 26px;
        }
        .footer-copy {
            font-size: 0.68rem;
            color: rgba(255,255,255,0.25);
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 18px;
        }

        /* ═══════════════ RESPONSIVE ═══════════════ */
        @media (max-width: 1024px) {
            .ai-grid  { grid-template-columns: repeat(2, 1fr); }
            .proj-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .nav-header { padding: 12px 18px; }
            .logo-img   { height: 32px; }
            .back-btn img { height: 36px; }
            .hero { padding: 95px 20px 36px; }
            .page-title { font-size: clamp(3.5rem, 15vw, 5.5rem); }
            .main-content { padding: 0 14px 56px; gap: 18px; }
            .section-card { padding: 26px 20px 32px; border-radius: 18px; }
            .section-title { font-size: 1.35rem; }
            .ai-grid,
            .proj-grid,
            .video-grid,
            .case-grid,
            .proof-grid { grid-template-columns: 1fr; }
        }
    </style>

    <style>
        /* added: page title letters set tight (owner's reference) */
        .page-title { letter-spacing: -0.015em; line-height: 0.86; }
    </style>

    <style>
        /* added: the island map with floating pins, under the page title (square boxes, no white frames) */
        .sub-wrap { width: 100%; max-width: 1000px; margin: 0 auto; }
        .sub-stage { position: relative; width: 100%; aspect-ratio: var(--ar); }
        .sub-map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }

        /* pins: polaroid picture on a stem; the tip touches the building */
        .pin { position: absolute; width: 8.5%; min-width: 46px; transform: translate(-50%, -100%); text-decoration: none; z-index: 5; }
        .pin-float { display: block; animation: pinFloat 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
        .pin:nth-of-type(2) .pin-float { animation-delay: -1.1s; }
        .pin:nth-of-type(3) .pin-float { animation-delay: -2.2s; }
        @keyframes pinFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .pin-img { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35)); }
        .pin-stem { display: block; width: 3px; height: 18px; margin: 0 auto; background: #1A1A1A; }
        .pin-dot { display: block; width: 12px; height: 12px; margin: -2px auto 0; background: #CC0033; border: 2px solid #1A1A1A; border-radius: 50%; }
        /* hover = the main map's island hover (index.html .island:hover): lifts up 8px, 1.05x, brighter, white glow */
        .pin-float { transition: all 0.4s ease-out; }
        .pin:hover .pin-float, .pin:focus-visible .pin-float { scale: 1.05; margin-top: -8px;
            filter: brightness(1.1) drop-shadow(0 20px 25px rgba(255, 255, 255, 0.35)); }
        /* pin name: small square black label, name only, pops up with the main map tooltip's bounce */
        .pin-pop { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%) scale(0.3); transform-origin: bottom center;
            background: rgba(0,0,0,0.85); color: #fff; padding: 6px 10px; border-radius: 0; white-space: nowrap;
            font-family: 'Anton', 'Noto Sans Thai', sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0.5px; line-height: 1.3;
            opacity: 0; visibility: hidden; pointer-events: none; z-index: 10;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .pin:hover .pin-pop, .pin:focus-visible .pin-pop { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(-10px) scale(1); }
        .sub-list { display: none; }

        /* arrival: cotton clouds over the map part left and right, the map comes into focus, then the pins pop in.
           Full version once per visit (sessionStorage); coming back to the page only fades in. */
        .sub-intro { position: absolute; inset: 0; overflow: hidden; z-index: 20; pointer-events: none; }
        .sub-haze { position: absolute; inset: 0; background: linear-gradient(180deg, #cfe9f8 0%, #eef8fe 100%); transition: opacity 1.1s ease 0.35s; }
        .cloud-pack { position: absolute; top: 0; bottom: 0; width: 60%; transition: transform 2s cubic-bezier(0.65, 0, 0.35, 1) 0.15s, opacity 0.9s ease 1.3s; }
        .cloud-pack.left { left: 0; } .cloud-pack.right { right: 0; }
        .cloud { position: absolute; display: block; height: auto; filter: drop-shadow(0 10px 14px rgba(70, 120, 170, 0.22)); animation: cloudBob 6s ease-in-out infinite; }
        .cloud:nth-child(2) { animation-delay: -2s; } .cloud:nth-child(3) { animation-delay: -4s; }
        @keyframes cloudBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
        .sub-loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 8px; opacity: 0; transition: opacity 0.3s; }
        .sub-loading i { width: 11px; height: 11px; border-radius: 50%; animation: dotHop 0.9s ease-in-out infinite; }
        .sub-loading i:nth-child(1) { background: #4285F4; } .sub-loading i:nth-child(2) { background: #EA4335; animation-delay: 0.12s; }
        .sub-loading i:nth-child(3) { background: #F5B800; animation-delay: 0.24s; } .sub-loading i:nth-child(4) { background: #34A853; animation-delay: 0.36s; }
        @keyframes dotHop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-9px); } }
        .sub-stage.is-loading .sub-loading { opacity: 1; }
        .sub-stage .sub-map { opacity: 0; filter: blur(14px) saturate(0.7); transform: scale(1.05);
            transition: opacity 1.3s ease 0.45s, filter 1.7s ease 0.45s, transform 2.2s cubic-bezier(0.2, 0.7, 0.2, 1) 0.3s; }
        .sub-stage .pin { opacity: 0; transform: translate(-50%, -100%) scale(0.6);
            transition: opacity 0.4s ease 1.6s, transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 1.6s; }
        .sub-stage .pin:nth-of-type(2) { transition-delay: 1.75s; } .sub-stage .pin:nth-of-type(3) { transition-delay: 1.9s; }
        .sub-stage.is-ready .sub-map { opacity: 1; filter: none; transform: none; }
        .sub-stage.is-ready .pin { opacity: 1; transform: translate(-50%, -100%) scale(1); }
        .sub-stage.is-ready .sub-haze { opacity: 0; }
        .sub-stage.is-ready .cloud-pack.left { transform: translateX(-118%); opacity: 0; }
        .sub-stage.is-ready .cloud-pack.right { transform: translateX(118%); opacity: 0; }
        .sub-stage.is-ready .sub-loading { opacity: 0; }
        .sub-stage.quick .sub-intro { display: none; }
        .sub-stage.quick .sub-map { filter: none; transform: none; transition: opacity 0.45s ease; }
        .sub-stage.quick .pin { transition: opacity 0.35s ease 0.2s, transform 0.45s ease 0.2s; }
        @media (prefers-reduced-motion: reduce) {
            .sub-intro { display: none; }
            .sub-stage .sub-map { filter: none; transform: none; transition: opacity 0.3s ease; }
            .sub-stage .pin, .sub-stage.is-ready .pin { transform: translate(-50%, -100%); transition: opacity 0.3s ease; }
            .pin-float, .cloud { animation: none; }
        }
        @media (max-width: 768px) {
            .pin-stem { height: 8px; } .pin-dot { width: 8px; height: 8px; }
            .pin-pop { display: none; }
            /* phones: a plain menu under the map (names only, like the pins) */
            .sub-list { display: block; margin: 18px 0 0; }
            .sub-list a { display: block; background: #1A1A1A; color: #fff; text-decoration: none; padding: 14px 16px; margin-bottom: 10px;
                font-family: 'Noto Sans Thai', sans-serif; font-size: 1rem; font-weight: 600; }
        }
    </style>
</head>

    function goBack(fallback) {
        try { if (document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return false; } } catch (e) {}
        location.href = fallback; return false;
    }
</script>

<script>
    /* added: arrival — clouds part once the map picture is ready (full version once per visit) */
    (function () {
        var st = document.querySelector('.sub-stage'), img = st && st.querySelector('.sub-map');
        if (!st || !img) return;
        var key = 'i365-intro:' + location.pathname, seen = false;
        try { seen = sessionStorage.getItem(key) === '1'; sessionStorage.setItem(key, '1'); } catch (e) {}
        if (seen) st.classList.add('quick');
        var started = false;
        function go() {
            if (started) return; started = true;
            st.classList.remove('is-loading');
            requestAnimationFrame(function () { requestAnimationFrame(function () { st.classList.add('is-ready'); }); });
            setTimeout(function () { var i = st.querySelector('.sub-intro'); if (i) i.remove(); }, 2800);
        }
        var slow = setTimeout(function () { if (!started) st.classList.add('is-loading'); }, 350);   // waiting dots only if the picture is slow
        if (img.complete && img.naturalWidth) go();
        else { img.addEventListener('load', go); img.addEventListener('error', go); setTimeout(go, 8000); }
        window.addEventListener('pageshow', function (e) { if (e.persisted) { st.classList.add('quick', 'is-ready'); clearTimeout(slow); } });
    })();
</script>
